server {
    listen 80;
    server_name _;

    error_page 403 404 =200 @fallback_image;

    location @fallback_image {
        internal;
        root /srv/images;
        default_type image/webp;
        try_files /default.webp =404;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location ~ (^|/)\. {
        return 403;
    }

    location ~* ^/.+\.(jpg|jpeg|png|gif|webp|avif|svg|ico)$ {
        root /srv/images;
        limit_except GET HEAD { deny all; }
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location ~ \.[^/]+$ {
        return 404;
    }

    location / {
        return 403;
    }
}
