server {
    listen 80;
    server_name _;

    location / {
        root /srv/images;
        autoindex on;
        autoindex_localtime on;
        try_files $uri $uri/ =404;
        limit_except GET HEAD { deny all; }
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico)$ {
        root /srv/images;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
}

