server {
    listen 80;
    server_name _;

    error_page 403 404 =200 /__fallback_image__;

    location = /__fallback_image__ {
        internal;
        alias /srv/images/default.webp;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        return 403;
    }

    location ~ /\. {
        deny all;
    }

    location ~* ^/.+\.(jpg|jpeg|png|gif|webp|avif|svg|ico)$ {
        root /srv/images;
        limit_except GET HEAD { deny all; }
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
}
